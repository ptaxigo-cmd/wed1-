<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetTaxi - შინაური ცხოველების ტრანსპორტირება</title>

    <style>
        :root {
            --primary-orange: #FF7012;
            --primary-dark: #0F172A;
            --teal-color: #00A3AD;
            --paw-color: #2B263F;
            --bg-dots: #FFFDF0;
            --text-dark: #1E293B;
            --text-gray: #64748B;
            --card-bg: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Georgian', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dots);
            background-image: radial-gradient(#E2D9C8 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            background-color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo Styling */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box {
            width: 60px;
            height: 60px;
            background-color: var(--primary-orange);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(255, 112, 18, 0.35);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-brand {
            font-size: 30px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .logo-brand .pet {
            color: var(--primary-dark);
        }

        .logo-brand .taxi {
            color: var(--primary-orange);
        }

        .logo-sub {
            color: var(--teal-color);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 22px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-orange);
        }

        .btn-call {
            background-color: var(--teal-color);
            color: white !important;
            padding: 10px 22px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 163, 173, 0.25);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-call:hover {
            transform: translateY(-2px);
            background-color: #008C95;
        }

        /* Hero Section */
        .hero {
            padding: 70px 20px 40px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-badge {
            background: #FFF0E6;
            color: var(--primary-orange);
            border: 1px solid rgba(255, 112, 18, 0.25);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 20px;
            line-height: 1.25;
        }

        .hero h1 span {
            color: var(--primary-orange);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-gray);
            max-width: 750px;
            margin: 0 auto 35px;
            font-weight: 500;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn-primary {
            background-color: var(--primary-orange);
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(255, 112, 18, 0.3);
            transition: all 0.2s;
        }

            transform: translateY(-2px);
            background-color: #E55
