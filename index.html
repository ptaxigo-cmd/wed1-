<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetTaxi - შინაური ცხოველების ტრანსპორტირება</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FF7012;
            --primary-dark: #0F172A;
            --teal-color: #00A3AD;
            --bg-dots: #FFFDF0;
            --text-dark: #1E293B;
            --text-gray: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Georgian', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dots);
            background-image: radial-gradient(#E2D9C8 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background-color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            background-color: var(--primary-orange);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(255, 112, 18, 0.35);
        }

        .logo-brand {
            font-size: 28px;
            font-weight: 800;
            line-height: 1;
        }

        .logo-brand .pet { color: var(--primary-dark); }
        .logo-brand .taxi { color: var(--primary-orange); }

        .logo-sub {
            color: var(--teal-color);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 15px;
        }

        .btn-call {
            background-color: var(--teal-color);
            color: white !important;
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero {
            padding: 80px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-badge {
            background: #FFF0E6;
            color: var(--primary-orange);
            border: 1px solid rgba(255, 112, 18, 0.25);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .hero h1 span { color: var(--primary-orange); }

        .hero p {
            font-size: 18px;
            color: var(--text-gray);
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .services-section {
            padding: 80px 20px;
            background-color: #FFFFFF;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h3 {
            color: var(--teal-color);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-title h2 {
            font-size: 32px;
            color: var(--primary-dark);
            font-weight: 800;
        }

        .services-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: var(--bg-dots);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
        }

        .service-icon {
            width: 60px;
            height: 60px;
            background-color: #FFF0E6;
            color: var(--primary-orange);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 20px;
        }

        .service-card h4 {
            font-size: 19px;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        footer {
            background-color: var(--primary-dark);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 30px; }
        }
    </style>
</head>
